name: Build reefy-guppy image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'server.py'
      - 'hardware_probe_server.py'
      - 'probe_nvidia.py'
      - 'probe_intel.py'
      - 'probe_amd.py'
      - 'probe_amd.cpp'
      - 'Dockerfile.nvidia'
      - 'Dockerfile.intel'
      - 'Dockerfile.amd'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('refs/heads/{0}', github.head_ref)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  build-push:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag
        id: tag
        run: |
          # Tag: <YYYY.MM.DD>-<run_number>. Immutable per build; same-day
          # rebuilds get -1, -2, ... so apps/guppy/app.json can pin to a
          # specific tag and pick up rebuilds without hash games.
          echo "version=$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/reefyai/reefy-guppy:${{ steps.tag.outputs.version }}
            ghcr.io/reefyai/reefy-guppy:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: github.event_name != 'pull_request'
        run: echo "Pushed ghcr.io/reefyai/reefy-guppy:${{ steps.tag.outputs.version }}"

  build-push-hardware-probes:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    strategy:
      matrix:
        accelerator: [nvidia, amd, intel]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.accelerator }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/reefyai/reefy-guppy:${{ matrix.accelerator }}-e2e
          cache-from: type=gha,scope=${{ matrix.accelerator }}-e2e
          cache-to: type=gha,mode=max,scope=${{ matrix.accelerator }}-e2e
